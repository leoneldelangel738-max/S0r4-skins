<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skin Viewer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
    overflow: hidden;
}

.viewer {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* CONTADOR */

.counter {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 18px;
    letter-spacing: 1px;
}

/* AREA PRINCIPAL */

.main-area {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    overflow: hidden;

    padding: 20px 120px;
}

/* IMAGEN PRINCIPAL */

.main-image {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: calc(100vh - 180px);

    object-fit: contain;

    image-rendering: auto;
}

/* BOTONES */

.nav-button {
    position: absolute;

    width: 58px;
    height: 58px;

    border: none;
    border-radius: 50%;

    background: white;

    font-size: 42px;

    cursor: pointer;

    box-shadow: 0 3px 12px rgba(0,0,0,0.18);

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-button:hover {
    background: #eeeeee;
}

.prev {
    left: 30px;
}

.next {
    right: 30px;
}

/* CONTENEDOR DE MINIATURAS */

.thumbnail-area {

    height: 135px;

    padding: 10px;

    background: #e5e5e5;

    display: flex;

    align-items: center;

    gap: 10px;

    overflow-x: auto;

    overflow-y: hidden;

}

/* MINIATURAS */

.thumbnail {

    width: 90px;
    height: 105px;

    flex-shrink: 0;

    padding: 6px;

    background: #ddd;

    border-radius: 6px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 3px solid transparent;

}

.thumbnail img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

}

.thumbnail.active {

    border-color: #444;

    background: white;

}

/* RESPONSIVE */

@media (max-width: 700px) {

    .main-area {
        padding-left: 70px;
        padding-right: 70px;
    }

    .nav-button {
        width: 48px;
        height: 48px;
        font-size: 32px;
    }

    .prev {
        left: 10px;
    }

    .next {
        right: 10px;
    }

}

</style>

</head>

<body>

<div class="viewer">

    <div class="counter" id="counter">
        SKIN 01 / 64
    </div>


    <div class="main-area">

        <button class="nav-button prev" onclick="previousImage()">
            ‹
        </button>


        <img
            id="mainImage"
            class="main-image"
            src=""
            alt="Skin"
        >


        <button class="nav-button next" onclick="nextImage()">
            ›
        </button>

    </div>


    <div
        class="thumbnail-area"
        id="thumbnailArea">
    </div>

</div>


<script>

/* =========================================

========================================= */

"https://i.postimg.cc/xNCvBYdv/64.png"

];


/* =========================================
   VARIABLES
========================================= */

let currentIndex = 0;

const mainImage =
    document.getElementById("mainImage");

const counter =
    document.getElementById("counter");

const thumbnailArea =
    document.getElementById("thumbnailArea");


/* =========================================
   MOSTRAR IMAGEN
========================================= */

function showImage(index) {

    currentIndex = index;

    mainImage.src = images[currentIndex];

    counter.textContent =
        "SKIN " +
        String(currentIndex + 1).padStart(2, "0") +
        " / " +
        images.length;


    document
        .querySelectorAll(".thumbnail")
        .forEach(function(item, i) {

            item.classList.toggle(
                "active",
                i === currentIndex
            );

        });


    const activeThumbnail =
        document.querySelector(".thumbnail.active");

    if (activeThumbnail) {

        activeThumbnail.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center"
        });

    }

}


/* =========================================
   SIGUIENTE
========================================= */

function nextImage() {

    currentIndex++;

    if (currentIndex >= images.length) {
        currentIndex = 0;
    }

    showImage(currentIndex);

}


/* =========================================
   ANTERIOR
========================================= */

function previousImage() {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = images.length - 1;
    }

    showImage(currentIndex);

}


/* =========================================
   CREAR MINIATURAS
========================================= */

images.forEach(function(url, index) {

    const container =
        document.createElement("div");

    container.className =
        "thumbnail";


    const image =
        document.createElement("img");

    image.src = url;

    image.loading = "lazy";


    container.appendChild(image);


    container.addEventListener(
        "click",
        function() {

            showImage(index);

        }
    );


    thumbnailArea.appendChild(container);

});


/* =========================================
   TECLADO
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            nextImage();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            previousImage();

        }

    }
);


/* =========================================
   INICIAR
========================================= */

showImage(0);

</script>

</body>
</html>

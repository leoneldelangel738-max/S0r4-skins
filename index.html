<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Visualizador de Skins</title>

  <style>

    /* ========================================= */
    /* CONFIGURACION GENERAL - MOBILE FIRST */
    /* ========================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f5f5;

      text-align: center;

      overflow-x: hidden;
    }


    /* ========================================= */
    /* CONTENEDOR PRINCIPAL */
    /* ========================================= */

    .carousel {
      width: 100%;
      margin: 0 auto;
      padding: 4px;
    }


    /* ========================================= */
    /* CONTADOR */
    /* ========================================= */

    #counter {
      font-size: 18px;
      font-weight: bold;
      margin: 4px 0 8px;
      color: #222;
    }


    /* ========================================= */
    /* VISUALIZADOR */
    /* ========================================= */

    .viewer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* ========================================= */
    /* ZONA PRINCIPAL DE LA IMAGEN */
    /* ========================================= */

    .main-image-container {
      width: 100%;

      height: 68vh;
      min-height: 380px;
      max-height: 680px;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      touch-action: pan-y;
    }


    /* ========================================= */
    /* IMAGEN PRINCIPAL */
    /* ========================================= */

    #mainImage {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* ========================================= */
    /* FLECHAS SOBRE LA IMAGEN */
    /* ========================================= */

    .arrow {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      z-index: 20;

      width: 46px;
      height: 70px;

      border: none;
      border-radius: 8px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      color:
        rgba(
          20,
          20,
          20,
          0.90
        );

      font-size: 58px;
      font-weight: normal;
      line-height: 1;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      text-shadow:
        0 1px 3px
        rgba(
          255,
          255,
          255,
          0.95
        ),

        0 1px 5px
        rgba(
          0,
          0,
          0,
          0.25
        );

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }


    #previousButton {
      left: 2px;
    }


    #nextButton {
      right: 2px;
    }


    .arrow:active {
      transform:
        translateY(-50%)
        scale(0.85);

      background:
        rgba(
          255,
          255,
          255,
          0.25
        );
    }


    /* ========================================= */
    /* CARRUSEL DE MINIATURAS */
    /* ========================================= */

    .thumbnails {
      width: 100%;

      display: flex;

      gap: 8px;

      overflow-x: auto;
      overflow-y: hidden;

      padding:
        8px
        4px
        12px;

      margin-top: 0;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;

      touch-action: pan-x;
    }


    /* ========================================= */
    /* TARJETA MINIATURA */
    /* ========================================= */

    .thumb {
      min-width: 70px;
      width: 70px;

      padding: 4px;

      background: #eeeeee;

      border:
        2px solid
        transparent;

      border-radius: 6px;

      cursor: pointer;

      flex-shrink: 0;

      transition:
        transform 0.15s ease,
        border 0.15s ease,
        background 0.15s ease;
    }


    /* ========================================= */
    /* MINIATURA ACTIVA */
    /* ========================================= */

    .thumb.active {
      border-color: #333;
      background: #ffffff;
    }


    .thumb:active {
      transform:
        scale(0.94);
    }


    /* ========================================= */
    /* IMAGEN DE MINIATURA */
    /* ========================================= */

    .thumb img {
      width: 100%;
      height: 90px;

      object-fit: contain;

      display: block;

      pointer-events: none;
    }


    /* ========================================= */
    /* NUMERO DE LA MINIATURA */
    /* ========================================= */

    .thumb-number {
      width: 100%;

      font-size: 12px;
      font-weight: bold;

      margin-top: 4px;

      color: #222;

      pointer-events: none;
    }


    /* ========================================= */
    /* TELEFONOS MUY PEQUEÑOS */
    /* ========================================= */

    @media (max-width: 400px) {

      .carousel {
        padding: 2px;
      }

      #counter {
        font-size: 17px;
        margin: 3px 0 6px;
      }

      .main-image-container {
        height: 65vh;
        min-height: 340px;
        max-height: 620px;
      }

      .arrow {
        width: 42px;
        height: 64px;
        font-size: 52px;
      }

      #previousButton {
        left: 0;
      }

      #nextButton {
        right: 0;
      }

      .thumbnails {
        gap: 7px;
        padding:
          6px
          2px
          10px;
      }

      .thumb {
        min-width: 64px;
        width: 64px;
        padding: 3px;
      }

      .thumb img {
        height: 82px;
      }

      .thumb-number {
        font-size: 11px;
      }

    }


    /* ========================================= */
    /* PANTALLAS MAS GRANDES */
    /* ========================================= */

    @media (min-width: 701px) {

      .carousel {
        max-width: 750px;
        padding: 8px;
      }

      .main-image-container {
        height: 72vh;
        max-height: 720px;
      }

      .arrow {
        width: 58px;
        height: 80px;
        font-size: 65px;
      }

      #previousButton {
        left: 10px;
      }

      #nextButton {
        right: 10px;
      }

    }

  </style>

</head>

    ];


    /* ========================================= */
    /* INDICE ACTUAL */
    /* ========================================= */

    let currentIndex = 0;


    /* ========================================= */
    /* ELEMENTOS */
    /* ========================================= */

    const mainImage =
      document.getElementById(
        "mainImage"
      );


    const counter =
      document.getElementById(
        "counter"
      );


    const previousButton =
      document.getElementById(
        "previousButton"
      );


    const nextButton =
      document.getElementById(
        "nextButton"
      );


    const thumbnails =
      document.getElementById(
        "thumbnails"
      );


    /* ========================================= */
    /* CREAR MINIATURAS */
    /* ========================================= */

    function createThumbnails() {

      images.forEach(
        function(image, index) {

          const thumb =
            document.createElement(
              "div"
            );

          thumb.className =
            "thumb";

          thumb.dataset.index =
            index;


          const imageElement =
            document.createElement(
              "img"
            );

          imageElement.src =
            image.url;

          imageElement.alt =
            "Skin " +
            image.name;


          const number =
            document.createElement(
              "div"
            );

          number.className =
            "thumb-number";

          number.textContent =
            image.name;


          thumb.appendChild(
            imageElement
          );

          thumb.appendChild(
            number
          );


          thumb.addEventListener(
            "click",
            function() {

              currentIndex =
                index;

              updateCarousel();

            }
          );


          thumbnails.appendChild(
            thumb
          );

        }
      );

    }


    /* ========================================= */
    /* OBTENER MINIATURAS */
    /* ========================================= */

    function getThumbs() {

      return document.querySelectorAll(
        ".thumb"
      );

    }


    /* ========================================= */
    /* ACTUALIZAR CARRUSEL */
    /* ========================================= */

    function updateCarousel() {

      if (
        images.length === 0
      ) {
        return;
      }


      const image =
        images[currentIndex];


      /* CAMBIAR IMAGEN */

      mainImage.src =
        image.url;


      mainImage.alt =
        "Skin " +
        image.name;


      /* ACTUALIZAR CONTADOR */

      counter.textContent =
        "SKIN " +

        String(
          currentIndex + 1
        ).padStart(
          2,
          "0"
        ) +

        " / " +

        images.length;


      const thumbs =
        getThumbs();


      /* QUITAR SELECCION */

      thumbs.forEach(
        function(thumb) {

          thumb.classList.remove(
            "active"
          );

        }
      );


      /* ACTIVAR MINIATURA ACTUAL */

      if (
        thumbs[currentIndex]
      ) {

        thumbs[currentIndex]
          .classList
          .add(
            "active"
          );


        /*
         * Mantiene visible
         * la skin activa.
         */

        thumbs[currentIndex]
          .scrollIntoView({

            behavior:
              "smooth",

            block:
              "nearest",

            inline:
              "center"

          });

      }

    }


    /* ========================================= */
    /* SIGUIENTE IMAGEN */
    /* ========================================= */

    function nextImage() {

      currentIndex++;


      if (
        currentIndex >=
        images.length
      ) {

        currentIndex = 0;

      }


      updateCarousel();

    }


    /* ========================================= */
    /* IMAGEN ANTERIOR */
    /* ========================================= */

    function previousImage() {

      currentIndex--;


      if (
        currentIndex < 0
      ) {

        currentIndex =
          images.length - 1;

      }


      updateCarousel();

    }


    /* ========================================= */
    /* BOTON SIGUIENTE */
    /* ========================================= */

    nextButton.addEventListener(
      "click",
      function() {

        nextImage();

      }
    );


    /* ========================================= */
    /* BOTON ANTERIOR */
    /* ========================================= */

    previousButton.addEventListener(
      "click",
      function() {

        previousImage();

      }
    );


    /* ========================================= */
    /* DESLIZAR EN MOVIL */
    /* ========================================= */

    let startX = 0;
    let startY = 0;


    mainImage.addEventListener(
      "touchstart",

      function(event) {

        startX =
          event.touches[0]
            .clientX;


        startY =
          event.touches[0]
            .clientY;

      },

      {
        passive: true
      }

    );


    mainImage.addEventListener(
      "touchend",

      function(event) {

        const endX =
          event.changedTouches[0]
            .clientX;


        const endY =
          event.changedTouches[0]
            .clientY;


        const differenceX =
          startX - endX;


        const differenceY =
          startY - endY;


        /*
         * Solo cambiar si el gesto
         * fue principalmente horizontal.
         */

        if (

          Math.abs(
            differenceX
          )

          >

          Math.abs(
            differenceY
          )

        ) {

          /* DESLIZAR A LA IZQUIERDA */

          if (
            differenceX > 50
          ) {

            nextImage();

          }


          /* DESLIZAR A LA DERECHA */

          else if (
            differenceX < -50
          ) {

            previousImage();

          }

        }

      },

      {
        passive: true
      }

    );


    /* ========================================= */
    /* TECLADO PARA PC */
    /* ========================================= */

    document.addEventListener(
      "keydown",

      function(event) {

        if (
          event.key ===
          "ArrowRight"
        ) {

          nextImage();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          previousImage();

        }

      }

    );


    /* ========================================= */
    /* INICIAR */
    /* ========================================= */

    createThumbnails();

    updateCarousel();

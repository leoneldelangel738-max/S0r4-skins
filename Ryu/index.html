<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Galería de Ryu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;text-align:center;overflow-x:hidden}
.carousel{width:100%;margin:0 auto;padding:4px}
#counter{font-size:18px;font-weight:bold;margin:4px 0 8px;color:#222}
.viewer{width:100%;display:flex;justify-content:center;align-items:center}
.main-image-container{width:100%;height:68vh;min-height:380px;max-height:680px;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#111;touch-action:none}
#mainImage{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;transform-origin:center center;transition:transform .15s ease;will-change:transform}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:46px;height:70px;border:none;border-radius:8px;background:rgba(255,255,255,.10);color:rgba(255,255,255,.95);font-size:58px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;text-shadow:0 1px 5px rgba(0,0,0,.7)}
#previousButton{left:2px}#nextButton{right:2px}
.arrow:active{transform:translateY(-50%) scale(.85);background:rgba(255,255,255,.25)}
.thumbnails{width:100%;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px 4px 12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:thin;touch-action:pan-x}
.thumb{min-width:70px;width:70px;padding:4px;background:#eee;border:2px solid transparent;border-radius:6px;cursor:pointer;flex-shrink:0}
.thumb.active{border-color:#333;background:#fff}.thumb:active{transform:scale(.94)}
.thumb img{width:100%;height:90px;object-fit:contain;display:block;pointer-events:none}
.thumb-number{width:100%;font-size:12px;font-weight:bold;margin-top:4px;color:#222;pointer-events:none}
@media(max-width:400px){.carousel{padding:2px}#counter{font-size:17px}.main-image-container{height:65vh;min-height:340px;max-height:620px}.arrow{width:42px;height:64px;font-size:52px}.thumb{min-width:64px;width:64px;padding:3px}.thumb img{height:82px}.thumb-number{font-size:11px}}
@media(min-width:701px){.carousel{max-width:750px;padding:8px}.main-image-container{height:72vh;max-height:720px}.arrow{width:58px;height:80px;font-size:65px}#previousButton{left:10px}#nextButton{right:10px}}
</style>
</head>
<body>
<div class="carousel">
<div id="counter">RYU 01 / 48</div>
<div class="viewer"><div class="main-image-container" id="mainImageContainer">
<img id="mainImage" src="" alt="Ryu" draggable="false">
<button type="button" class="arrow" id="previousButton" aria-label="Imagen anterior">‹</button>
<button type="button" class="arrow" id="nextButton" aria-label="Imagen siguiente">›</button>
</div></div>
<div class="thumbnails" id="thumbnails"></div>
</div>
<script>
const images=[
  ["01", "https://i.postimg.cc/DZj5m9Km/01.png"],
  ["02", "https://i.postimg.cc/G27z9W1t/02.png"],
  ["03", "https://i.postimg.cc/hvXsm2Sc/03.png"],
  ["04", "https://i.postimg.cc/J0sxXp1z/04.png"],
  ["05", "https://i.postimg.cc/D0S6Gx2z/05.png"],
  ["06", "https://i.postimg.cc/2y1GW0z6/06.png"],
  ["07", "https://i.postimg.cc/6q8cZM9q/07.png"],
  ["08", "https://i.postimg.cc/mkPj9mb1/08.png"],
  ["09", "https://i.postimg.cc/3Nk1GtK4/09.png"],
  ["10", "https://i.postimg.cc/XqrL5sV5/10.png"],
  ["11", "https://i.postimg.cc/NFKDXdgx/11.png"],
  ["12", "https://i.postimg.cc/ZnXcx6R6/12.png"],
  ["13", "https://i.postimg.cc/MHgDm1T0/13.png"],
  ["14", "https://i.postimg.cc/Xqt8k9Jw/14.png"],
  ["15", "https://i.postimg.cc/Wzxnw03S/15.png"],
  ["16", "https://i.postimg.cc/J0Sq5jnp/16.png"],
  ["17", "https://i.postimg.cc/L5GT3jXy/17.png"],
  ["18", "https://i.postimg.cc/PJ04Q1x3/18.png"],
  ["19", "https://i.postimg.cc/fy1KfYLP/19.png"],
  ["20", "https://i.postimg.cc/PJ04Q1x0/20.png"],
  ["21", "https://i.postimg.cc/3NzBF2NM/21.png"],
  ["22", "https://i.postimg.cc/ZnXcx6nz/22.png"],
  ["23", "https://i.postimg.cc/8cxHmLcV/23.png"],
  ["24", "https://i.postimg.cc/Wzxnw0zT/24.png"],
  ["25", "https://i.postimg.cc/sfLwzCcB/25.png"],
  ["26", "https://i.postimg.cc/7PRm4rVG/26.png"],
  ["27", "https://i.postimg.cc/sfLwzCcG/27.png"],
  ["28", "https://i.postimg.cc/sfLwzCcZ/28.png"],
  ["29", "https://i.postimg.cc/wxr0zYVJ/29.png"],
  ["30", "https://i.postimg.cc/HWNBm124/30.png"],
  ["31", "https://i.postimg.cc/fWPBsQKv/31.png"],
  ["32", "https://i.postimg.cc/NGnptv4D/32.png"],
  ["33", "https://i.postimg.cc/h4YpnRrp/33.png"],
  ["34", "https://i.postimg.cc/fWPBsQKH/34.png"],
  ["35", "https://i.postimg.cc/kXtwXY1c/35.png"],
  ["36", "https://i.postimg.cc/7YTXYtss/36.png"],
  ["37", "https://i.postimg.cc/c48T4k9D/37.png"],
  ["38", "https://i.postimg.cc/Ghszhg75/38.png"],
  ["39", "https://i.postimg.cc/gk64ktSQ/39.png"],
  ["40", "https://i.postimg.cc/VLb4LZZ8/40.png"],
  ["41", "https://i.postimg.cc/3JD9JffQ/41.png"],
  ["42", "https://i.postimg.cc/pXnkXcct/42.png"],
  ["43", "https://i.postimg.cc/MKjtK33z/43.png"],
  ["44", "https://i.postimg.cc/gk64ktt0/44.png"],
  ["45", "https://i.postimg.cc/vZFh17Cw/45.png"],
  ["46", "https://i.postimg.cc/wj82t5n9/46.png"],
  ["47", "https://i.postimg.cc/HkDzJ0Fn/47.png"],
  ["48", "https://i.postimg.cc/G27z9W1H/48.png"]
].map(item=>({name:item[0],url:item[1]}));

const mainImage=document.getElementById("mainImage");
const mainImageContainer=document.getElementById("mainImageContainer");
const counter=document.getElementById("counter");
const previousButton=document.getElementById("previousButton");
const nextButton=document.getElementById("nextButton");
const thumbnails=document.getElementById("thumbnails");

let currentIndex=0,scale=1,translateX=0,translateY=0;
const minScale=1,maxScale=4;
let startX=0,startY=0,startTranslateX=0,startTranslateY=0,initialDistance=0,initialScale=1,isDragging=false,isPinching=false;

function updateTransform(animate=false){
mainImage.style.transition=animate?"transform .2s ease":"none";
mainImage.style.transform=`translate(${translateX}px,${translateY}px) scale(${scale})`;
}
function resetZoom(){scale=1;translateX=0;translateY=0;updateTransform(true)}
function limitPosition(){
if(scale<=1){translateX=0;translateY=0;return}
const cw=mainImageContainer.clientWidth,ch=mainImageContainer.clientHeight;
const sw=mainImage.offsetWidth*scale,sh=mainImage.offsetHeight*scale;
const maxX=Math.max(0,(sw-cw)/2),maxY=Math.max(0,(sh-ch)/2);
translateX=Math.max(-maxX,Math.min(maxX,translateX));
translateY=Math.max(-maxY,Math.min(maxY,translateY));
}
function getDistance(a,b){return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}

function createThumbnails(){
images.forEach((image,index)=>{
const thumb=document.createElement("div");thumb.className="thumb";
const img=document.createElement("img");img.src=image.url;img.alt="Ryu "+image.name;
const number=document.createElement("div");number.className="thumb-number";number.textContent=image.name;
thumb.append(img,number);thumb.addEventListener("click",()=>{currentIndex=index;updateCarousel()});
thumbnails.appendChild(thumb);
});
}
function updateCarousel(){
const image=images[currentIndex];resetZoom();mainImage.src=image.url;mainImage.alt="Ryu "+image.name;
counter.textContent="RYU "+String(currentIndex+1).padStart(2,"0")+" / "+images.length;
const thumbs=document.querySelectorAll(".thumb");
thumbs.forEach(t=>t.classList.remove("active"));
if(thumbs[currentIndex]){thumbs[currentIndex].classList.add("active");thumbs[currentIndex].scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"})}
}
function nextImage(){currentIndex=(currentIndex+1)%images.length;updateCarousel()}
function previousImage(){currentIndex=(currentIndex-1+images.length)%images.length;updateCarousel()}
nextButton.addEventListener("click",nextImage);previousButton.addEventListener("click",previousImage);

mainImageContainer.addEventListener("touchstart",e=>{
if(e.touches.length===2){isPinching=true;isDragging=false;initialDistance=getDistance(e.touches[0],e.touches[1]);initialScale=scale;return}
if(e.touches.length===1){isDragging=true;isPinching=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTranslateX=translateX;startTranslateY=translateY}
},{passive:false});

mainImageContainer.addEventListener("touchmove",e=>{
if(e.touches.length===2){e.preventDefault();isPinching=true;isDragging=false;scale=initialScale*(getDistance(e.touches[0],e.touches[1])/initialDistance);scale=Math.max(minScale,Math.min(maxScale,scale));limitPosition();updateTransform();return}
if(e.touches.length===1&&isDragging&&scale>1){e.preventDefault();translateX=startTranslateX+e.touches[0].clientX-startX;translateY=startTranslateY+e.touches[0].clientY-startY;limitPosition();updateTransform()}
},{passive:false});

mainImageContainer.addEventListener("touchend",e=>{
if(isPinching){if(scale<=1.02)resetZoom();else{limitPosition();updateTransform(true)}if(e.touches.length<2)isPinching=false}
if(e.changedTouches.length===1&&scale<=1.02&&!isPinching){
const dx=startX-e.changedTouches[0].clientX,dy=startY-e.changedTouches[0].clientY;
if(Math.abs(dx)>Math.abs(dy)&&dx>60)nextImage();
else if(Math.abs(dx)>Math.abs(dy)&&dx<-60)previousImage();
}
if(e.touches.length===0){isDragging=false;isPinching=false}
},{passive:true});

mainImageContainer.addEventListener("touchcancel",()=>{isDragging=false;isPinching=false});
mainImageContainer.addEventListener("wheel",e=>{e.preventDefault();scale+=e.deltaY<0?.2:-.2;scale=Math.max(minScale,Math.min(maxScale,scale));if(scale<=1){translateX=0;translateY=0}limitPosition();updateTransform()},{passive:false});
mainImageContainer.addEventListener("dblclick",resetZoom);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nextImage();if(e.key==="ArrowLeft")previousImage();if(e.key==="Escape")resetZoom()});
createThumbnails();updateCarousel();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Galería de Terry</title>

<style>

/* ========================================= */
/* GENERAL */
/* ========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  text-align: center;
  overflow-x: hidden;
}


/* ========================================= */
/* CARRUSEL NORMAL */
/* ========================================= */

.carousel {
  width: 100%;
  margin: 0 auto;
  padding: 4px;
}

#counter {
  font-size: 18px;
  font-weight: bold;
  margin: 4px 0 8px;
  color: #222;
}

.viewer {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.main-image-container {
  width: 100%;
  height: 68vh;
  min-height: 380px;
  max-height: 680px;

  position: relative;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;

  background: #111;

  cursor: pointer;
}

#mainImage {
  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  object-fit: contain;

  display: block;

  user-select: none;
  -webkit-user-drag: none;

  pointer-events: none;
}


/* ========================================= */
/* FLECHAS CARRUSEL */
/* ========================================= */

.arrow {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  z-index: 20;

  width: 46px;
  height: 70px;

  border: none;

  border-radius: 8px;

  background: rgba(255,255,255,0.10);

  color: rgba(255,255,255,0.95);

  font-size: 58px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  text-shadow: 0 1px 5px rgba(0,0,0,0.7);
}

#previousButton {
  left: 2px;
}

#nextButton {
  right: 2px;
}

.arrow:active {
  transform:
    translateY(-50%)
    scale(0.85);

  background: rgba(255,255,255,0.25);
}


/* ========================================= */
/* MINIATURAS */
/* ========================================= */

.thumbnails {
  width: 100%;

  display: flex;

  gap: 8px;

  overflow-x: auto;
  overflow-y: hidden;

  padding: 8px 4px 12px;

  scroll-behavior: smooth;

  -webkit-overflow-scrolling: touch;

  scrollbar-width: thin;

  touch-action: pan-x;
}

.thumb {
  min-width: 70px;
  width: 70px;

  padding: 4px;

  background: #eeeeee;

  border: 2px solid transparent;

  border-radius: 6px;

  cursor: pointer;

  flex-shrink: 0;
}

.thumb.active {
  border-color: #333;
  background: #ffffff;
}

.thumb:active {
  transform: scale(0.94);
}

.thumb img {
  width: 100%;
  height: 90px;

  object-fit: contain;

  display: block;

  pointer-events: none;
}

.thumb-number {
  width: 100%;

  font-size: 12px;

  font-weight: bold;

  margin-top: 4px;

  color: #222;

  pointer-events: none;
}


/* ========================================= */
/* VISOR PANTALLA COMPLETA */
/* ========================================= */

.fullscreen-viewer {
  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 100dvh;

  background: #000;

  z-index: 9999;

  display: none;

  justify-content: center;
  align-items: center;

  overflow: hidden;

  touch-action: none;
}

.fullscreen-viewer.active {
  display: flex;
}


/* ========================================= */
/* IMAGEN PANTALLA COMPLETA */
/* ========================================= */

#fullscreenImage {
  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;

  -webkit-user-drag: none;

  transform-origin: center center;

  will-change: transform;

  pointer-events: none;
}


/* ========================================= */
/* BOTON CERRAR */
/* ========================================= */

.close-button {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 10020;

  width: 48px;
  height: 48px;

  border: none;

  border-radius: 50%;

  background: rgba(0,0,0,0.55);

  color: white;

  font-size: 30px;

  cursor: pointer;
}


/* ========================================= */
/* CONTADOR PANTALLA COMPLETA */
/* ========================================= */

.fullscreen-counter {
  position: absolute;

  top: 18px;
  left: 18px;

  z-index: 10010;

  color: white;

  font-size: 16px;

  font-weight: bold;

  background: rgba(0,0,0,0.45);

  padding: 8px 12px;

  border-radius: 20px;
}


/* ========================================= */
/* FLECHAS PANTALLA COMPLETA */
/* ========================================= */

.fullscreen-arrow {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  z-index: 10010;

  width: 55px;
  height: 80px;

  border: none;

  background: rgba(255,255,255,0.10);

  color: white;

  font-size: 65px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 8px;
}

#fullscreenPrevious {
  left: 5px;
}

#fullscreenNext {
  right: 5px;
}


/* ========================================= */
/* MOVIL */
/* ========================================= */

@media (max-width: 400px) {

  .carousel {
    padding: 2px;
  }

  #counter {
    font-size: 17px;
  }

  .main-image-container {
    height: 65vh;
    min-height: 340px;
    max-height: 620px;
  }

  .arrow {
    width: 42px;
    height: 64px;
    font-size: 52px;
  }

  .thumb {
    min-width: 64px;
    width: 64px;
    padding: 3px;
  }

  .thumb img {
    height: 82px;
  }

  .thumb-number {
    font-size: 11px;
  }

  .fullscreen-arrow {
    width: 45px;
    height: 70px;
    font-size: 52px;
  }

}


/* ========================================= */
/* PC */
/* ========================================= */

@media (min-width: 701px) {

  .carousel {
    max-width: 750px;
    padding: 8px;
  }

  .main-image-container {
    height: 72vh;
    max-height: 720px;
  }

  .arrow {
    width: 58px;
    height: 80px;
    font-size: 65px;
  }

  #previousButton {
    left: 10px;
  }

  #nextButton {
    right: 10px;
  }

}

</style>
</head>

<body>


<!-- ========================================= -->
<!-- CARRUSEL NORMAL -->
<!-- ========================================= -->

<div class="carousel">

  <div id="counter">
    TERRY 01 / 48
  </div>

  <div class="viewer">

    <div
      class="main-image-container"
      id="mainImageContainer"
    >

      <img
        id="mainImage"
        src=""
        alt="Terry"
        draggable="false"
      >

      <button
        type="button"
        class="arrow"
        id="previousButton"
        aria-label="Imagen anterior"
      >
        ‹
      </button>

      <button
        type="button"
        class="arrow"
        id="nextButton"
        aria-label="Imagen siguiente"
      >
        ›
      </button>

    </div>

  </div>

  <div
    class="thumbnails"
    id="thumbnails"
  ></div>

</div>


<!-- ========================================= -->
<!-- VISOR PANTALLA COMPLETA -->
<!-- ========================================= -->

<div
  class="fullscreen-viewer"
  id="fullscreenViewer"
>

  <div
    class="fullscreen-counter"
    id="fullscreenCounter"
  >
    TERRY 01 / 48
  </div>

  <button
    type="button"
    class="close-button"
    id="closeFullscreen"
    aria-label="Cerrar"
  >
    ×
  </button>

  <button
    type="button"
    class="fullscreen-arrow"
    id="fullscreenPrevious"
    aria-label="Imagen anterior"
  >
    ‹
  </button>

  <img
    id="fullscreenImage"
    src=""
    alt="Terry"
    draggable="false"
  >

  <button
    type="button"
    class="fullscreen-arrow"
    id="fullscreenNext"
    aria-label="Imagen siguiente"
  >
    ›
  </button>

</div>


<script>


/* ========================================= */
/* LISTA DE IMAGENES */
/* ========================================= */

const images = [

  ["01", "https://i.postimg.cc/DZj5m9Km/01.png"],
  ["02", "https://i.postimg.cc/G27z9W1t/02.png"],
  ["03", "https://i.postimg.cc/hvXsm2Sc/03.png"],
  ["04", "https://i.postimg.cc/J0sxXp1z/04.png"],
  ["05", "https://i.postimg.cc/D0S6Gx2z/05.png"],
  ["06", "https://i.postimg.cc/2y1GW0z6/06.png"],
  ["07", "https://i.postimg.cc/6q8cZM9q/07.png"],
  ["08", "https://i.postimg.cc/mkPj9mb1/08.png"],
  ["09", "https://i.postimg.cc/3Nk1GtK4/09.png"],
  ["10", "https://i.postimg.cc/XqrL5sV5/10.png"],
  ["11", "https://i.postimg.cc/NFKDXdgx/11.png"],
  ["12", "https://i.postimg.cc/ZnXcx6R6/12.png"],
  ["13", "https://i.postimg.cc/MHgDm1T0/13.png"],
  ["14", "https://i.postimg.cc/Xqt8k9Jw/14.png"],
  ["15", "https://i.postimg.cc/Wzxnw03S/15.png"],
  ["16", "https://i.postimg.cc/J0Sq5jnp/16.png"],
  ["17", "https://i.postimg.cc/L5GT3jXy/17.png"],
  ["18", "https://i.postimg.cc/PJ04Q1x3/18.png"],
  ["19", "https://i.postimg.cc/fy1KfYLP/19.png"],
  ["20", "https://i.postimg.cc/PJ04Q1x0/20.png"],
  ["21", "https://i.postimg.cc/3NzBF2NM/21.png"],
  ["22", "https://i.postimg.cc/ZnXcx6nz/22.png"],
  ["23", "https://i.postimg.cc/8cxHmLcV/23.png"],
  ["24", "https://i.postimg.cc/Wzxnw0zT/24.png"],
  ["25", "https://i.postimg.cc/sfLwzCcB/25.png"],
  ["26", "https://i.postimg.cc/7PRm4rVG/26.png"],
  ["27", "https://i.postimg.cc/sfLwzCcG/27.png"],
  ["28", "https://i.postimg.cc/sfLwzCcZ/28.png"],
  ["29", "https://i.postimg.cc/wxr0zYVJ/29.png"],
  ["30", "https://i.postimg.cc/HWNBm124/30.png"],
  ["31", "https://i.postimg.cc/fWPBsQKv/31.png"],
  ["32", "https://i.postimg.cc/NGnptv4D/32.png"],
  ["33", "https://i.postimg.cc/h4YpnRrp/33.png"],
  ["34", "https://i.postimg.cc/fWPBsQKH/34.png"],
  ["35", "https://i.postimg.cc/kXtwXY1c/35.png"],
  ["36", "https://i.postimg.cc/7YTXYtss/36.png"],
  ["37", "https://i.postimg.cc/c48T4k9D/37.png"],
  ["38", "https://i.postimg.cc/Ghszhg75/38.png"],
  ["39", "https://i.postimg.cc/gk64ktSQ/39.png"],
  ["40", "https://i.postimg.cc/VLb4LZZ8/40.png"],
  ["41", "https://i.postimg.cc/3JD9JffQ/41.png"],
  ["42", "https://i.postimg.cc/pXnkXcct/42.png"],
  ["43", "https://i.postimg.cc/MKjtK33z/43.png"],
  ["44", "https://i.postimg.cc/gk64ktt0/44.png"],
  ["45", "https://i.postimg.cc/vZFh17Cw/45.png"],
  ["46", "https://i.postimg.cc/wj82t5n9/46.png"],
  ["47", "https://i.postimg.cc/HkDzJ0Fn/47.png"],
  ["48", "https://i.postimg.cc/G27z9W1H/48.png"]

].map(function(item) {

  return {
    name: item[0],
    url: item[1]
  };

});


/* ========================================= */
/* ELEMENTOS */
/* ========================================= */

const mainImage =
  document.getElementById("mainImage");

const mainImageContainer =
  document.getElementById("mainImageContainer");

const counter =
  document.getElementById("counter");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const thumbnails =
  document.getElementById("thumbnails");


const fullscreenViewer =
  document.getElementById("fullscreenViewer");

const fullscreenImage =
  document.getElementById("fullscreenImage");

const fullscreenCounter =
  document.getElementById("fullscreenCounter");

const closeFullscreen =
  document.getElementById("closeFullscreen");

const fullscreenPrevious =
  document.getElementById("fullscreenPrevious");

const fullscreenNext =
  document.getElementById("fullscreenNext");


/* ========================================= */
/* VARIABLES */
/* ========================================= */

let currentIndex = 0;


/* ZOOM */

let scale = 1;

let translateX = 0;

let translateY = 0;

const minScale = 1;

const maxScale = 4;


/* TOQUES */

let startX = 0;

let startY = 0;

let startTranslateX = 0;

let startTranslateY = 0;

let initialDistance = 0;

let initialScale = 1;

let isDragging = false;

let isPinching = false;

let tapStartTime = 0;


/* ========================================= */
/* ACTUALIZAR CARRUSEL */
/* ========================================= */

function updateCarousel() {

  const image =
    images[currentIndex];

  mainImage.src =
    image.url;

  mainImage.alt =
    "Terry " +
    image.name;

  fullscreenImage.src =
    image.url;

  fullscreenImage.alt =
    "Terry " +
    image.name;


  const number =

    String(
      currentIndex + 1
    ).padStart(2, "0");


  counter.textContent =

    "TERRY " +

    number +

    " / " +

    images.length;


  fullscreenCounter.textContent =

    "TERRY " +

    number +

    " / " +

    images.length;


  const thumbs =
    document.querySelectorAll(".thumb");


  thumbs.forEach(function(thumb) {

    thumb.classList.remove("active");

  });


  if (thumbs[currentIndex]) {

    thumbs[currentIndex]
      .classList
      .add("active");


    thumbs[currentIndex]
      .scrollIntoView({

        behavior: "smooth",

        block: "nearest",

        inline: "center"

      });

  }

}


/* ========================================= */
/* CREAR MINIATURAS */
/* ========================================= */

function createThumbnails() {

  images.forEach(function(image, index) {

    const thumb =
      document.createElement("div");


    thumb.className =
      "thumb";


    const imageElement =
      document.createElement("img");


    imageElement.src =
      image.url;


    imageElement.alt =
      "Terry " +
      image.name;


    const number =
      document.createElement("div");


    number.className =
      "thumb-number";


    number.textContent =
      image.name;


    thumb.appendChild(imageElement);

    thumb.appendChild(number);


    thumb.addEventListener(
      "click",

      function() {

        currentIndex = index;

        updateCarousel();

      }

    );


    thumbnails.appendChild(thumb);

  });

}


/* ========================================= */
/* SIGUIENTE */
/* ========================================= */

function nextImage() {

  currentIndex++;

  if (
    currentIndex >= images.length
  ) {

    currentIndex = 0;

  }

  resetZoom();

  updateCarousel();

}


/* ========================================= */
/* ANTERIOR */
/* ========================================= */

function previousImage() {

  currentIndex--;

  if (
    currentIndex < 0
  ) {

    currentIndex =
      images.length - 1;

  }

  resetZoom();

  updateCarousel();

}


/* ========================================= */
/* BOTONES CARRUSEL */
/* ========================================= */

nextButton.addEventListener(
  "click",

  function(event) {

    event.stopPropagation();

    nextImage();

  }

);


previousButton.addEventListener(
  "click",

  function(event) {

    event.stopPropagation();

    previousImage();

  }

);


/* ========================================= */
/* ABRIR PANTALLA COMPLETA */
/* ========================================= */

mainImageContainer.addEventListener(
  "click",

  function() {

    openFullscreen();

  }

);


function openFullscreen() {

  fullscreenViewer
    .classList
    .add("active");


  document.body.style.overflow =
    "hidden";


  resetZoom();

  updateCarousel();

}


/* ========================================= */
/* CERRAR */
/* ========================================= */

function closeFullscreenViewer() {

  fullscreenViewer
    .classList
    .remove("active");


  document.body.style.overflow =
    "";

  resetZoom();

}


closeFullscreen.addEventListener(
  "click",

  closeFullscreenViewer
);


/* ========================================= */
/* BOTONES PANTALLA COMPLETA */
/* ========================================= */

fullscreenNext.addEventListener(
  "click",

  function(event) {

    event.stopPropagation();

    nextImage();

  }

);


fullscreenPrevious.addEventListener(
  "click",

  function(event) {

    event.stopPropagation();

    previousImage();

  }

);


/* ========================================= */
/* ZOOM */
/* ========================================= */

function updateTransform(
  animate = false
) {

  fullscreenImage.style.transition =

    animate

      ? "transform 0.2s ease"

      : "none";


  fullscreenImage.style.transform =

    `translate(${translateX}px, ${translateY}px) scale(${scale})`;

}


/* ========================================= */
/* RESETEAR ZOOM */
/* ========================================= */

function resetZoom() {

  scale = 1;

  translateX = 0;

  translateY = 0;

  updateTransform(true);

}


/* ========================================= */
/* LIMITAR MOVIMIENTO */
/* ========================================= */

function limitPosition() {

  if (scale <= 1) {

    translateX = 0;

    translateY = 0;

    return;

  }


  const containerWidth =
    fullscreenViewer.clientWidth;


  const containerHeight =
    fullscreenViewer.clientHeight;


  const imageWidth =
    fullscreenImage.offsetWidth;


  const imageHeight =
    fullscreenImage.offsetHeight;


  const scaledWidth =
    imageWidth * scale;


  const scaledHeight =
    imageHeight * scale;


  const maxX =

    Math.max(
      0,
      (scaledWidth - containerWidth) / 2
    );


  const maxY =

    Math.max(
      0,
      (scaledHeight - containerHeight) / 2
    );


  translateX =

    Math.max(
      -maxX,
      Math.min(
        maxX,
        translateX
      )
    );


  translateY =

    Math.max(
      -maxY,
      Math.min(
        maxY,
        translateY
      )
    );

}


/* ========================================= */
/* DISTANCIA DOS DEDOS */
/* ========================================= */

function getDistance(
  touch1,
  touch2
) {

  const x =

    touch2.clientX -
    touch1.clientX;


  const y =

    touch2.clientY -
    touch1.clientY;


  return Math.sqrt(

    x * x +

    y * y

  );

}


/* ========================================= */
/* INICIO TOUCH */
/* ========================================= */

fullscreenViewer.addEventListener(
  "touchstart",

  function(event) {

    tapStartTime =
      Date.now();


    if (
      event.touches.length === 2
    ) {

      isPinching = true;

      isDragging = false;


      initialDistance =

        getDistance(
          event.touches[0],
          event.touches[1]
        );


      initialScale =
        scale;


      return;

    }


    if (
      event.touches.length === 1
    ) {

      isDragging = true;

      isPinching = false;


      startX =
        event.touches[0].clientX;


      startY =
        event.touches[0].clientY;


      startTranslateX =
        translateX;


      startTranslateY =
        translateY;

    }

  },

  {
    passive: false
  }

);


/* ========================================= */
/* MOVIMIENTO TOUCH */
/* ========================================= */

fullscreenViewer.addEventListener(
  "touchmove",

  function(event) {

    /* ZOOM DOS DEDOS */

    if (
      event.touches.length === 2
    ) {

      event.preventDefault();


      isPinching = true;

      isDragging = false;


      const currentDistance =

        getDistance(
          event.touches[0],
          event.touches[1]
        );


      const zoomRatio =

        currentDistance /
        initialDistance;


      scale =

        initialScale *
        zoomRatio;


      scale =

        Math.max(
          minScale,
          Math.min(
            maxScale,
            scale
          )
        );


      limitPosition();

      updateTransform();

      return;

    }


    /* MOVER IMAGEN AMPLIADA */

    if (

      event.touches.length === 1

      &&

      isDragging

      &&

      scale > 1

    ) {

      event.preventDefault();


      const currentX =
        event.touches[0].clientX;


      const currentY =
        event.touches[0].clientY;


      translateX =

        startTranslateX +

        currentX -

        startX;


      translateY =

        startTranslateY +

        currentY -

        startY;


      limitPosition();

      updateTransform();

    }

  },

  {
    passive: false
  }

);


/* ========================================= */
/* FINAL TOUCH */
/* ========================================= */

fullscreenViewer.addEventListener(
  "touchend",

  function(event) {

    const duration =

      Date.now() -
      tapStartTime;


    if (
      isPinching
    ) {

      if (
        scale <= 1.02
      ) {

        resetZoom();

      }

      else {

        limitPosition();

        updateTransform(true);

      }


      if (
        event.touches.length < 2
      ) {

        isPinching = false;

      }

    }


    /* ===================================== */
    /* DESLIZAR PARA CAMBIAR IMAGEN */
    /* ===================================== */

    if (

      event.changedTouches.length === 1

      &&

      scale <= 1.02

      &&

      !isPinching

    ) {

      const endX =
        event.changedTouches[0].clientX;


      const endY =
        event.changedTouches[0].clientY;


      const differenceX =
        startX - endX;


      const differenceY =
        startY - endY;


      /* DESLIZAR IZQUIERDA */

      if (

        Math.abs(differenceX) >
        Math.abs(differenceY)

        &&

        differenceX > 50

      ) {

        nextImage();

      }


      /* DESLIZAR DERECHA */

      else if (

        Math.abs(differenceX) >
        Math.abs(differenceY)

        &&

        differenceX < -50

      ) {

        previousImage();

      }

    }


    if (
      event.touches.length === 0
    ) {

      isDragging = false;

      isPinching = false;

    }

  },

  {
    passive: true
  }

);


/* ========================================= */
/* CANCELAR TOUCH */
/* ========================================= */

fullscreenViewer.addEventListener(
  "touchcancel",

  function() {

    isDragging = false;

    isPinching = false;

  }

);


/* ========================================= */
/* ZOOM CON MOUSE */
/* ========================================= */

fullscreenViewer.addEventListener(
  "wheel",

  function(event) {

    event.preventDefault();


    if (
      event.deltaY < 0
    ) {

      scale += 0.2;

    }

    else {

      scale -= 0.2;

    }


    scale =

      Math.max(
        minScale,
        Math.min(
          maxScale,
          scale
        )
      );


    limitPosition();

    updateTransform();

  },

  {
    passive: false
  }

);


/* ========================================= */
/* DOBLE CLICK */
/* ========================================= */

fullscreenViewer.addEventListener(
  "dblclick",

  function(event) {

    if (
      event.target === fullscreenImage
    ) {

      resetZoom();

    }

  }

);


/* ========================================= */
/* TECLADO */
/* ========================================= */

document.addEventListener(
  "keydown",

  function(event) {

    if (

      event.key === "ArrowRight"

    ) {

      nextImage();

    }


    if (

      event.key === "ArrowLeft"

    ) {

      previousImage();

    }


    if (

      event.key === "Escape"

    ) {

      closeFullscreenViewer();

    }

  }

);


/* ========================================= */
/* INICIAR */
/* ========================================= */

createThumbnails();

updateCarousel();

</script>

</body>
</html>

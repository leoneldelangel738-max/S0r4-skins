<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>Galería de MYTHRA</title>
        <style>
            *{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}html,body{
margin:0;
padding:0;
width:100%;
min-height:100%
}body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
text-align:center;
overflow-x:hidden
}.carousel{
width:100%;
margin:0 auto;
padding:4px
}#counter{
font-size:18px;
font-weight:bold;
margin:4px 0 8px;
color:#222
}.viewer{
width:100%;
display:flex;
justify-content:center;
align-items:center
}.main-image-container{
width:100%;
height:68vh;
min-height:380px;
max-height:680px;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:#111;
cursor:pointer;
touch-action:pan-y
}#mainImage{
max-width:100%;
max-height:100%;
width:auto;
height:auto;
object-fit:contain;
display:block;
user-select:none;
-webkit-user-drag:none;
pointer-events:none
}.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
z-index:20;
width:46px;
height:70px;
border:none;
border-radius:8px;
background:rgba(255,255,255,.10);
color:white;
font-size:58px;
line-height:1;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
padding:0
}#previousButton{
left:2px
}#nextButton{
right:2px
}.arrow:active{
transform:translateY(-50%) scale(.85);
background:rgba(255,255,255,.25)
}.thumbnails{
width:100%;
display:flex;
gap:8px;
overflow-x:auto;
overflow-y:hidden;
padding:8px 4px 12px;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
scrollbar-width:thin;
touch-action:pan-x
}.thumb{
min-width:70px;
width:70px;
padding:4px;
background:#eee;
border:2px solid transparent;
border-radius:6px;
cursor:pointer;
flex-shrink:0
}.thumb.active{
border-color:#333;
background:#fff
}.thumb:active{
transform:scale(.94)
}.thumb img{
width:100%;
height:90px;
object-fit:contain;
display:block;
pointer-events:none
}.thumb-number{
width:100%;
font-size:12px;
font-weight:bold;
margin-top:4px;
color:#222;
pointer-events:none
}.fullscreen-viewer{
position:fixed;
inset:0;
width:100%;
height:100dvh;
background:#000;
z-index:9999;
display:none;
justify-content:center;
align-items:center;
overflow:hidden;
touch-action:none
}.fullscreen-viewer.active{
display:flex
}#fullscreenImage{
max-width:100%;
max-height:100%;
width:auto;
height:auto;
object-fit:contain;
user-select:none;
-webkit-user-drag:none;
transform-origin:center center;
will-change:transform;
pointer-events:none
}.close-button{
position:absolute;
top:12px;
right:12px;
z-index:10020;
width:48px;
height:48px;
border:none;
border-radius:50%;
background:rgba(0,0,0,.55);
color:white;
font-size:30px;
cursor:pointer
}.fullscreen-counter{
position:absolute;
top:18px;
left:18px;
z-index:10010;
color:white;
font-size:16px;
font-weight:bold;
background:rgba(0,0,0,.45);
padding:8px 12px;
border-radius:20px
}.fullscreen-arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
z-index:10010;
width:55px;
height:80px;
border:none;
border-radius:8px;
background:rgba(255,255,255,.10);
color:white;
font-size:65px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center
}#fullscreenPrevious{
left:5px
}#fullscreenNext{
right:5px
}@media(max-width:400px){
.carousel{
padding:2px
}#counter{
font-size:17px
}.main-image-container{
height:65vh;
min-height:340px;
max-height:620px
}.arrow{
width:42px;
height:64px;
font-size:52px
}.thumb{
min-width:64px;
width:64px;
padding:3px
}.thumb img{
height:82px
}.thumb-number{
font-size:11px
}.fullscreen-arrow{
width:45px;
height:70px;
font-size:52px
}
}@media(min-width:701px){
.carousel{
max-width:750px;
padding:8px
}.main-image-container{
height:72vh;
max-height:720px
}.arrow{
width:58px;
height:80px;
font-size:65px
}#previousButton{
left:10px
}#nextButton{
right:10px
}
}
        </style>
    </head>
    <body>
        <div class="carousel">
            <div id="counter">MYTHRA 01 / 48</div>
            <div class="viewer">
                <div class="main-image-container" id="mainImageContainer">
                    <img id="mainImage" src="" alt="MYTHRA" draggable="false">
                    <button type="button" class="arrow" id="previousButton">‹</button>
                    <button type="button" class="arrow" id="nextButton">›</button>
                </div>
            </div>
            <div class="thumbnails" id="thumbnails">
            </div>
        </div>
        <div class="fullscreen-viewer" id="fullscreenViewer">
            <div class="fullscreen-counter" id="fullscreenCounter">MYTHRA 01 / 48</div>
            <button type="button" class="close-button" id="closeFullscreen">×</button>
            <button type="button" class="fullscreen-arrow" id="fullscreenPrevious">‹</button>
            <img id="fullscreenImage" src="" alt="MYTHRA" draggable="false">
            <button type="button" class="fullscreen-arrow" id="fullscreenNext">›</button>
        </div>
        <script>
            const CHARACTER="MYTHRA",CHARACTER_UPPER="MYTHRA";
const images=[  ["01", 'https://i.postimg.cc/VsHGFVs2/1.png'],
            ["02", 'https://i.postimg.cc/yYMLM3Zs/10.png'],
            ["03", 'https://i.postimg.cc/GhWXWTy3/11.png'],
            ["04", 'https://i.postimg.cc/kX0T0RbX/12.png'],
            ["05", 'https://i.postimg.cc/bN7m7Sts/13.png'],
            ["06", 'https://i.postimg.cc/rFBfBRrR/14.png'],
            ["07", 'https://i.postimg.cc/m2vmv1HM/15.png'],
            ["08", 'https://i.postimg.cc/15kvkVqD/16.png'],
            ["09", 'https://i.postimg.cc/c4pFptnQ/17.png'],
            ["10", 'https://i.postimg.cc/65kMk4vV/18.png'],
            ["11", 'https://i.postimg.cc/Dy9x94Xc/19.png'],
            ["12", 'https://i.postimg.cc/tRmSzMRw/2.png'],
            ["13", 'https://i.postimg.cc/Nf3d32H4/20.png'],
            ["14", 'https://i.postimg.cc/28s0sLZG/21.png'],
            ["15", 'https://i.postimg.cc/XY9s4NfF/22.png'],
            ["16", 'https://i.postimg.cc/vZ50b8rf/23.png'],
            ["17", 'https://i.postimg.cc/g23gmcVq/24.png'],
            ["18", 'https://i.postimg.cc/13DvsRGr/25.png'],
            ["19", 'https://i.postimg.cc/VkXKmsqK/26.png'],
            ["20", 'https://i.postimg.cc/pLKsRVfc/27.png'],
            ["21", 'https://i.postimg.cc/4xpWs460/28.png'],
            ["22", 'https://i.postimg.cc/fRY8DW74/29.png'],
            ["23", 'https://i.postimg.cc/bYFCRBYK/3.png'],
            ["24", 'https://i.postimg.cc/Bn2m4Z5f/30.png'],
            ["25", 'https://i.postimg.cc/1zPJtxBT/31.png'],
            ["26", 'https://i.postimg.cc/VN1D6ygh/32.png'],
            ["27", 'https://i.postimg.cc/43ZBdCPr/33.png'],
            ["28", 'https://i.postimg.cc/d0v41M6b/34.png'],
            ["29", 'https://i.postimg.cc/7LDm6vXv/35.png'],
            ["30", 'https://i.postimg.cc/CKYm1yJT/36.png'],
            ["31", 'https://i.postimg.cc/R09XFrGC/37.png'],
            ["32", 'https://i.postimg.cc/R09XFrGV/38.png'],
            ["33", 'https://i.postimg.cc/W4jX3RS4/39.png'],
            ["34", 'https://i.postimg.cc/pXh0cJyC/4.png'],
            ["35", 'https://i.postimg.cc/5t1n0cpY/40.png'],
            ["36", 'https://i.postimg.cc/YS38LXyq/41.png'],
            ["37", 'https://i.postimg.cc/bvTLS6Fw/42.png'],
            ["38", 'https://i.postimg.cc/YS38LXy9/43.png'],
            ["39", 'https://i.postimg.cc/1zHMVWYf/44.png'],
            ["40", 'https://i.postimg.cc/R0RGJPb6/45.png'],
            ["41", 'https://i.postimg.cc/Xv8xB2DC/46.png'],
            ["42", 'https://i.postimg.cc/N04b2NPr/47.png'],
            ["43", 'https://i.postimg.cc/1zHMVWYF/48.png'],
            ["44", 'https://i.postimg.cc/wTyW4Q3S/5.png'],
            ["45", 'https://i.postimg.cc/WbF9YwhL/6.png'],
            ["46", 'https://i.postimg.cc/bND6V9s8/7.png'],
            ["47", 'https://i.postimg.cc/5NYPKS6f/8.png'],
            ["48", 'https://i.postimg.cc/Qx2f2KTs/9.png']].map(item=>({
name:item[0],url:item[1]
}));
const mainImage=document.getElementById('mainImage'),mainImageContainer=document.getElementById('mainImageContainer'),counter=document.getElementById('counter'),previousButton=document.getElementById('previousButton'),nextButton=document.getElementById('nextButton'),thumbnails=document.getElementById('thumbnails'),fullscreenViewer=document.getElementById('fullscreenViewer'),fullscreenImage=document.getElementById('fullscreenImage'),fullscreenCounter=document.getElementById('fullscreenCounter'),closeFullscreen=document.getElementById('closeFullscreen'),fullscreenPrevious=document.getElementById('fullscreenPrevious'),fullscreenNext=document.getElementById('fullscreenNext');
let currentIndex=0,scale=1,translateX=0,translateY=0;
const minScale=1,maxScale=4;
let startX=0,startY=0,startTranslateX=0,startTranslateY=0,initialDistance=0,initialScale=1,isDragging=false,isPinching=false;
function updateCarousel(){
const image=images[currentIndex],number=String(currentIndex+1).padStart(2,'0');
mainImage.src=image.url;
mainImage.alt=CHARACTER+' '+image.name;
fullscreenImage.src=image.url;
fullscreenImage.alt=CHARACTER+' '+image.name;
counter.textContent=CHARACTER_UPPER+' '+number+' / '+images.length;
fullscreenCounter.textContent=CHARACTER_UPPER+' '+number+' / '+images.length;
document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
if(document.querySelectorAll('.thumb')[currentIndex]){
document.querySelectorAll('.thumb')[currentIndex].classList.add('active');
document.querySelectorAll('.thumb')[currentIndex].scrollIntoView({
behavior:'smooth',block:'nearest',inline:'center'
});
}
}function createThumbnails(){
images.forEach((image,index)=>{
const thumb=document.createElement('div');
thumb.className='thumb';
const img=document.createElement('img');
img.src=image.url;
img.alt=CHARACTER+' '+image.name;
const number=document.createElement('div');
number.className='thumb-number';
number.textContent=image.name;
thumb.append(img,number);
thumb.addEventListener('click',()=>{
currentIndex=index;
resetZoom();
updateCarousel()
});
thumbnails.appendChild(thumb);
});
}function resetZoom(){
scale=1;
translateX=0;
translateY=0;
updateTransform(true)
}function nextImage(){
currentIndex=(currentIndex+1)%images.length;
resetZoom();
updateCarousel()
}function previousImage(){
currentIndex=(currentIndex-1+images.length)%images.length;
resetZoom();
updateCarousel()
}function updateTransform(animate=false){
fullscreenImage.style.transition=animate?'transform .2s ease':'none';
fullscreenImage.style.transform=`translate(${
translateX
}px,${
translateY
}px) scale(${
scale
})`
}function limitPosition(){
if(scale<=1){
translateX=0;
translateY=0;
return
}const cw=fullscreenViewer.clientWidth,ch=fullscreenViewer.clientHeight,sw=fullscreenImage.offsetWidth*scale,sh=fullscreenImage.offsetHeight*scale,maxX=Math.max(0,(sw-cw)/2),maxY=Math.max(0,(sh-ch)/2);
translateX=Math.max(-maxX,Math.min(maxX,translateX));
translateY=Math.max(-maxY,Math.min(maxY,translateY))
}function getDistance(a,b){
return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)
}nextButton.addEventListener('click',e=>{
e.stopPropagation();
nextImage()
});
previousButton.addEventListener('click',e=>{
e.stopPropagation();
previousImage()
});
mainImageContainer.addEventListener('click',()=>{
fullscreenViewer.classList.add('active');
document.body.style.overflow='hidden';
resetZoom();
updateCarousel()
});
closeFullscreen.addEventListener('click',e=>{
e.stopPropagation();
fullscreenViewer.classList.remove('active');
document.body.style.overflow='';
resetZoom()
});
fullscreenNext.addEventListener('click',e=>{
e.stopPropagation();
nextImage()
});
fullscreenPrevious.addEventListener('click',e=>{
e.stopPropagation();
previousImage()
});
fullscreenViewer.addEventListener('touchstart',e=>{
if(e.touches.length===2){
isPinching=true;
isDragging=false;
initialDistance=getDistance(e.touches[0],e.touches[1]);
initialScale=scale;
return
}if(e.touches.length===1){
isDragging=true;
isPinching=false;
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
startTranslateX=translateX;
startTranslateY=translateY;
}
},{
passive:false
});
fullscreenViewer.addEventListener('touchmove',e=>{
if(e.touches.length===2){
e.preventDefault();
isPinching=true;
isDragging=false;
scale=initialScale*(getDistance(e.touches[0],e.touches[1])/initialDistance);
scale=Math.max(minScale,Math.min(maxScale,scale));
limitPosition();
updateTransform();
return
}if(e.touches.length===1&&isDragging&&scale>1){
e.preventDefault();
translateX=startTranslateX+e.touches[0].clientX-startX;
translateY=startTranslateY+e.touches[0].clientY-startY;
limitPosition();
updateTransform()
}
},{
passive:false
});
fullscreenViewer.addEventListener('touchend',e=>{
if(e.changedTouches.length===1&&scale<=1.02&&!isPinching){
const dx=startX-e.changedTouches[0].clientX,dy=startY-e.changedTouches[0].clientY;
if(Math.abs(dx)>Math.abs(dy)&&dx>50)nextImage();
else if(Math.abs(dx)>Math.abs(dy)&&dx<-50)previousImage()
}if(e.touches.length===0){
isDragging=false;
isPinching=false;
if(scale<=1.02)resetZoom();
else{
limitPosition();
updateTransform(true)
}
}
},{
passive:true
});
fullscreenViewer.addEventListener('touchcancel',()=>{
isDragging=false;
isPinching=false
});
fullscreenViewer.addEventListener('wheel',e=>{
e.preventDefault();
scale+=e.deltaY<0?.2:-.2;
scale=Math.max(minScale,Math.min(maxScale,scale));
limitPosition();
updateTransform()
},{
passive:false
});
fullscreenViewer.addEventListener('dblclick',()=>resetZoom());
document.addEventListener('keydown',e=>{
if(!fullscreenViewer.classList.contains('active'))return;
if(e.key==='ArrowRight')nextImage();
if(e.key==='ArrowLeft')previousImage();
if(e.key==='Escape'){
fullscreenViewer.classList.remove('active');
document.body.style.overflow='';
resetZoom()
}
});
createThumbnails();
updateCarousel();
        </script>
    </body>
</html>
